<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Factorization Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Prime Factorization Calculator</h1>
        <input type="number" id="numberInput" placeholder="Enter a positive integer" />
        <button onclick="factorize()">Factorize</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>

<div class="tempat-iklan" style="position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 9999; max-width: 160px; background: transparent;">
    
    <div onclick="this.parentElement.style.display='none'" style="background: rgba(0,0,0,0.6); color: white; text-align: center; padding: 4px 0; cursor: pointer; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; border-top-right-radius: 5px;">
        Close X
    </div>
    
    <div class="iklanan" data-format="vertikal" style="display: flex; justify-content: center; align-items: center; overflow: hidden; background: white; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);"></div>

</div>


<div class="tempat-iklan" style="position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 9999; max-width: 160px; background: transparent;">
    
    <div onclick="this.parentElement.style.display='none'" style="background: rgba(0,0,0,0.6); color: white; text-align: center; padding: 4px 0; cursor: pointer; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; border-top-left-radius: 5px;">
        Close X
    </div>
    
    <div class="iklanan" data-format="vertikal" style="display: flex; justify-content: center; align-items: center; overflow: hidden; background: white; box-shadow: -2px 2px 5px rgba(0,0,0,0.2);"></div>

</div>

<script src="https://swrdfgd.github.io/iklanan.js"></script>
</body>
</html>
